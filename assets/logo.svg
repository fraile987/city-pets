      <stop offset="100%" stop-color="#12355C"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2C94C"/>
      <stop offset="100%" stop-color="#C9A227"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#navy)"/>
  <circle cx="256" cy="256" r="150" fill="#ffffff" fill-opacity="0.06"/>
  <g fill="url(#gold)">
    <!-- Huella: almohadilla central -->
