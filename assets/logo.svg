  </g>
  <text x="256" y="424" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" font-weight="bold" fill="#ffffff">City Pets</text>
  <text x="256" y="456" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" letter-spacing="6" fill="#F2C94C">TU MASCOTA FELIZ</text>
