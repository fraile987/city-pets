# =========================================================
# CITY PETS — nginx: reverse proxy (Fase 9.6)
#
# Instalación:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/city-pets
#   sudo ln -s /etc/nginx/sites-available/city-pets /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Antes de usar, revisar:
#   - server_name: reemplazar el placeholder por el dominio real
#     (la fase de dominio/DNS/Let's Encrypt viene después).
#   - client_max_body_size: >= 26m (imágenes 5 MB + videos 25 MB
#     con overhead multipart). nginx por defecto usa 1 MB.
# =========================================================

# Límite de cuerpo de las peticiones (contexto http).
client_max_body_size 26m;

server {
    listen 80;
    server_name citypets.local;   # TODO: dominio real en la fase posterior

    # ---------- Preparación para HTTPS (fase posterior) ----------
    # Activar cuando exista el certificado (Let's Encrypt):
    #   listen 443 ssl;
    #   ssl_certificate     /etc/letsencrypt/live/citypets.local/fullchain.pem;
    #   ssl_certificate_key /etc/letsencrypt/live/citypets.local/privkey.pem;
    #   # Redirección HTTP -> HTTPS:
    #   if ($scheme != "https") { return 301 https://$host$request_uri; }

    # Cabeceras para que el backend conozca al cliente real.
    # (El backend usa trust proxy = 1 en producción.)
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # API + frontend + medios: todo lo sirve el backend (misma origen).
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
    }

    # Medios subidos: los sirve el backend con nosniff.
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
    }
}